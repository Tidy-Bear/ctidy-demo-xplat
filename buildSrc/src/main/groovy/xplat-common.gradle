plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
}

version = "$mod_version"
base {
    archivesName = "$archives_base_name-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    // withJavadocJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name 'Sponge'
                url 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name 'ParchmentMC'
                    url 'https://maven.parchmentmc.org/'
                },
                maven {
                    name 'NeoForge'
                    url 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name 'BlameJared'
        url 'https://maven.blamejared.com'
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:24.1.0'
}

// Declare capabilities on the outgoing configurations.
// https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', /*'javadocElements'*/].forEach { String variant ->
    configurations."$variant".outgoing {
        capability("$group:${project.name}:$version")
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

class MixinConfiguration {
    final List<String> configs = []
    final List<String> refMaps = []
    boolean mixinExtrasIncluding = true
}

class ExpandablePropertiesConfiguration {
    private static final List<String> BUILTIN_KEYS = [
            'mod_id',
            'mod_name',
            'license',
            'credits',
            'author',
            'resourcepack_format',
            'datapack_format',
            'java_version',
            'mixin_version',
            'minecraft_version',
    ]

    final List<String> filter
    final Map<String, ?> props

    ExpandablePropertiesConfiguration(Project project) {
        filter = ['pack.mcmeta', '*.mixins.json']
        def projProps = project.properties
        def props = [
                'version': project.version,
                'group': project.group,
                'description': project.description,
        ]
        for (final def key in BUILTIN_KEYS) {
            props[key] = key in projProps ? projProps[key] : ''
        }
        this.props = props
    }
}

class XplatExtension {
    private final MixinConfiguration mixinConfiguration
    private final ExpandablePropertiesConfiguration expandablePropertiesConfiguration

    XplatExtension(Project project) {
        this.mixinConfiguration = new MixinConfiguration()
        this.expandablePropertiesConfiguration = new ExpandablePropertiesConfiguration(project)
    }

    MixinConfiguration getMixin() {
        return mixinConfiguration
    }

    void mixin(Closure<?> closure) {
        closure.delegate = mixinConfiguration
        closure()
    }

    void mixin(Action<MixinConfiguration> action) {
        action(mixinConfiguration)
    }

    ExpandablePropertiesConfiguration getExpandableProperties() {
        return expandablePropertiesConfiguration
    }

    void expandableProperties(Closure<?> closure) {
        closure.delegate = expandablePropertiesConfiguration
        closure()
    }

    void expandableProperties(Action<ExpandablePropertiesConfiguration> action) {
        action(expandablePropertiesConfiguration)
    }
}
def extXplat = project.extensions.create('xplat', XplatExtension)

static void expandPropsToResources(ProcessResources task, Iterable<String> filter, Map<String, ?> props) {
    task.duplicatesStrategy = DuplicatesStrategy.INCLUDE
    task.filesMatching(filter) { FileCopyDetails details ->
        expand props
    }
    task.inputs.properties props
}
tasks.withType(ProcessResources).configureEach { ProcessResources task ->
    expandPropsToResources(task, extXplat.expandableProperties.filter, extXplat.expandableProperties.props)
    def mixinConfigs = extXplat.mixin.configs
    task.exclude { FileTreeElement elem ->
        def name = elem.name
        return name.endsWith('mixins.json') && !(mixinConfigs.contains(name))
    }
}

tasks.withType(JavaCompile).configureEach { JavaCompile task ->
    task.options.release = Integer.parseInt(java_version)
    task.options.encoding = 'UTF-8'
    task.options.deprecation = false
}

static void eachLicences(Project project, Action<File> action) {
    project.fileTree(dir: project.rootDir, include: 'LICENSE*')
            .files.each { File file -> action.execute(file) }
}

tasks.named('sourcesJar') { Task task ->
    eachLicences(rootProject) { File file ->
        jar.from(file)
    }
}

tasks.named('jar', Jar) { Jar task ->
    eachLicences(rootProject) { File file ->
        jar.from(file)
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : author,
                'Specification-Version' : '1', // We are version 1 of ourselves
                'Implementation-Title'  : mod_name,
                'Implementation-Version': jar.archiveVersion,
                'Implementation-Vendor' : author,
                'Built-On-Minecraft'    : minecraft_version,
                'Implementation-Timestamp': new Date().format('yyyy-MM-dd\'T\'HH:mm:ssZ'),
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = "Local"
            // url System.getenv("local_maven_url")
            url = file('build/repo').toURI()
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
